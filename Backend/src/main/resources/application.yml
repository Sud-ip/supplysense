spring:
  application:
    name: supplysense-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supplysense}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # M6: added metrics + prometheus. health/info stay public (see
        # SecurityConfig); prometheus is also public here at the
        # application layer but should be network-restricted (firewall/
        # security group) in any real deployment - not exposed to the
        # public internet even though the app itself doesn't gate it
        # with a JWT (a metrics scraper isn't an application user).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
