spring:
  config:
    # The repository-root .env is a properties-compatible file. This keeps
    # local Spring Boot runs aligned with the same DB_URL used on Render.
    # Render injects real environment variables, which take precedence.
    import: optional:file:../.env[.properties]

  application:
    name: supplysense-backend

  datasource:
    # Neon and Render both provide a complete JDBC URL, including the
    # database credentials. Do not override those credentials separately.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  # Render (and most PaaS platforms) inject a PORT env var and route
  # traffic to whatever port the app actually listens on - hardcoding
  # 8080 here would make the deployed app unreachable. Falls back to
  # 8080 for local dev, where nothing sets PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    # Local-dev-only default. MUST be overridden via the JWT_SECRET env
    # var in any real deployment - this is enforced by discipline, not
    # by the framework, so double-check it's actually set on Render
    # before going live.
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  cors:
    # Comma-separated. Defaults to the local Vite dev server; set
    # CORS_ALLOWED_ORIGINS on Render to your real Vercel URL once you
    # have it (e.g. https://supplysense.vercel.app), no code change
    # needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
